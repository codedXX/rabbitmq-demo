server:
  port: 8081

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    # RabbitMQ 建立连接的超时时间。
    connection-timeout: 1s

    # 开启生产者 Confirm；correlated 表示确认结果可以关联 CorrelationData。
    publisher-confirm-type: correlated

    # 开启生产者 Return；消息无法路由到队列时触发 ReturnsCallback。
    publisher-returns: true

    # RabbitTemplate 发送失败时的重试配置。
    template:
      retry:
        # 开启生产者发送重试。
        enabled: true
        # 第一次失败后的等待时间。
        initial-interval: 1000ms
        # 下次等待时间 = initial-interval * multiplier。
        multiplier: 1
        # 总尝试次数，包括第一次发送，不是额外重试次数。
        max-attempts: 3
    listener:
      simple:
        acknowledge-mode:  manual # 不做处理